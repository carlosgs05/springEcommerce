# Perfil de producción. Se activa con: spring.profiles.active=prod
# (por ejemplo variable de entorno SPRING_PROFILES_ACTIVE=prod). Sin valores reales: todo por variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${ALLOWED_ORIGIN}
# URL publica del frontend para los enlaces de los correos (obligatoria en produccion, sin valor por defecto)
app.frontend.url=${FRONTEND_URL}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# Una base no vacía sin historial Flyway debe fallar, no saltarse V1
spring.flyway.baseline-on-migrate=false
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
