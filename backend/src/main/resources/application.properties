# Carga backend/.env (si existe) al arrancar desde la carpeta backend
spring.config.import=optional:file:.env[.properties]

# Nombre de la aplicación y puerto del servidor
spring.application.name=ecommerce
server.port=8080

# Base de datos PostgreSQL (la contraseña viene de .env / variables de entorno)
spring.sql.init.platform=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate: el esquema lo manejan las migraciones Flyway, Hibernate solo valida
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway: una base local ya existente se marca como versión 1 sin re-ejecutar V1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Spring Session JDBC: las tablas las crea la migración V1
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.schema=classpath:org/springframework/session/jdbc/schema-postgresql.sql
spring.session.jdbc.table-name=spring_session

# Seguridad: clave JWT (Base64, mínimo 32 bytes) y orígenes CORS
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173}

# Configuración de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
