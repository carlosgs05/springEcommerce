# Carga backend/.env (si existe) al arrancar desde la carpeta backend
spring.config.import=optional:file:.env[.properties]

# Nombre de la aplicación y puerto del servidor
spring.application.name=ecommerce
server.port=8080

# Base de datos PostgreSQL (la contraseña viene de .env / variables de entorno)
spring.sql.init.platform=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate: el esquema lo manejan las migraciones Flyway, Hibernate solo valida
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway: una base local ya existente se marca como versión 1 sin re-ejecutar V1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Spring Session JDBC: las tablas las crea la migración V1
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.schema=classpath:org/springframework/session/jdbc/schema-postgresql.sql
spring.session.jdbc.table-name=spring_session

# Seguridad: clave JWT (Base64, mínimo 32 bytes) y orígenes CORS
app.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173}
# URL publica del frontend (enlaces de los correos)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Errores: nunca mensaje de la excepcion ni traza hacia el cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Configuración de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Pasarelas de pago (sandbox). Sin llave real, el backend sigue arrancando y los
# endpoints de /api/pagos/** responden 503 "Pasarela no configurada todavia".
app.culqi.secret-key=${CULQI_SECRET_KEY:}
app.culqi.public-key=${CULQI_PUBLIC_KEY:}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
